asyncapi: 3.0.0
info:
  title: Google Nest SDM Events
  version: 0.1.0
  description: Decoded SDM event data delivered by Google Cloud Pub/Sub. The subscriber owns acknowledgement and delivery policy.
defaultContentType: application/json
servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub
    description: Google Cloud Pub/Sub using a project-owned SDM topic.
channels:
  sdmEvents:
    address: projects/{project}/topics/{topic}
    description: Trait updates, camera events, and resource relation updates.
    parameters:
      project:
        description: Google Cloud project hosting the topic.
      topic:
        description: Topic configured in Device Access.
    messages:
      event:
        $ref: '#/components/messages/SDMEvent'
operations:
  receiveEvents:
    action: receive
    channel:
      $ref: '#/channels/sdmEvents'
    summary: Receive changes to authorized devices and structures.
components:
  messages:
    SDMEvent:
      name: SDMEvent
      title: SDM resource event
      payload:
        $ref: '#/components/schemas/EventEnvelope'
  schemas:
    EventEnvelope:
      title: EventEnvelope
      type: object
      description: SDM payload after decoding Pub/Sub message data. Outer event IDs differ from camera image event IDs.
      required: [eventId, timestamp, userId]
      properties:
        eventId:
          type: string
          minLength: 1
          description: Unique outer SDM event identifier.
        timestamp:
          type: string
          format: date-time
          description: Event occurrence time; receipt order may differ.
        userId:
          type: string
          minLength: 1
          description: Obfuscated user identifier.
        resourceUpdate:
          $ref: '#/components/schemas/ResourceUpdate'
        relationUpdate:
          $ref: '#/components/schemas/ResourceRelation'
        eventThreadId:
          type: string
          description: Identifier linking updateable notifications, distinct from the event session.
        eventThreadState:
          $ref: '#/components/schemas/EventThreadState'
        resourceGroup:
          type: array
          description: Resource names that may have related updates.
          items:
            type: string
      additionalProperties: true
    ResourceUpdate:
      title: ResourceUpdate
      type: object
      description: Typed trait changes and device action events for a resource.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        traits:
          $ref: './traits.openapi.yaml#/components/schemas/Traits'
        events:
          $ref: '#/components/schemas/CameraEvents'
      additionalProperties: true
    ResourceRelation:
      title: ResourceRelation
      type: object
      description: A relation change. Subject may be empty when structure access is unavailable.
      required: [type, subject, object]
      properties:
        type:
          $ref: '#/components/schemas/RelationType'
        subject:
          type: string
        object:
          type: string
          minLength: 1
      additionalProperties: true
    RelationType:
      title: RelationType
      type: string
      description: Extensible relation state; known values are CREATED, UPDATED, DELETED.
      pattern: '^[A-Z][A-Z0-9_]*$'
      x-known-values: [CREATED, UPDATED, DELETED]
    EventThreadState:
      title: EventThreadState
      type: string
      description: Extensible thread state; known values are STARTED, UPDATED, ENDED.
      pattern: '^[A-Z][A-Z0-9_]*$'
      x-known-values: [STARTED, UPDATED, ENDED]
    CameraEvents:
      title: CameraEvents
      type: object
      description: Fully qualified event keys; future event payloads are retained.
      properties:
        sdm.devices.events.CameraMotion.Motion:
          $ref: '#/components/schemas/CameraMotionEvent'
        sdm.devices.events.CameraPerson.Person:
          $ref: '#/components/schemas/CameraPersonEvent'
        sdm.devices.events.CameraSound.Sound:
          $ref: '#/components/schemas/CameraSoundEvent'
        sdm.devices.events.CameraClipPreview.ClipPreview:
          $ref: '#/components/schemas/CameraClipPreviewEvent'
        sdm.devices.events.DoorbellChime.Chime:
          $ref: '#/components/schemas/DoorbellChimeEvent'
      additionalProperties: true
    CameraMotionEvent:
      title: CameraMotionEvent
      type: object
      description: Motion detected. Event session and image event identifiers depend on the device family.
      properties:
        eventId:
          type: string
        eventSessionId:
          type: string
      additionalProperties: true
    CameraPersonEvent:
      title: CameraPersonEvent
      type: object
      description: Person detected. Event session and image event identifiers depend on the device family.
      properties:
        eventId:
          type: string
        eventSessionId:
          type: string
      additionalProperties: true
    CameraSoundEvent:
      title: CameraSoundEvent
      type: object
      description: Sound detected by the camera.
      properties:
        eventId:
          type: string
        eventSessionId:
          type: string
      additionalProperties: true
    DoorbellChimeEvent:
      title: DoorbellChimeEvent
      type: object
      description: Doorbell pressed. Session and image identifiers depend on the device family.
      properties:
        eventId:
          type: string
        eventSessionId:
          type: string
      additionalProperties: true
    CameraClipPreviewEvent:
      title: CameraClipPreviewEvent
      type: object
      description: Clip preview URL associated with related events by eventSessionId. No inner eventId is required.
      required: [eventSessionId, previewUrl]
      properties:
        eventSessionId:
          type: string
          minLength: 1
        previewUrl:
          type: string
          format: uri
          pattern: '^https://'
      additionalProperties: true
