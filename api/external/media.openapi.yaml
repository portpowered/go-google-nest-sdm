{
  "openapi": "3.0.3",
  "info": {
    "title": "SDM event media follow-up downloads",
    "version": "1.0.0",
    "description": "Provider-issued media URLs have variable origins. Use only URLs received from trusted GenerateImage responses or ClipPreview events; neither operation follows redirects."
  },
  "servers": [
    {
      "url": "https://{mediaHost}",
      "variables": {
        "mediaHost": {
          "default": "media.example.invalid",
          "description": "Host supplied by the provider; no stable host is documented."
        }
      }
    }
  ],
  "paths": {
    "/sdm_event_snapshot/{imageId}": {
      "get": {
        "operationId": "DownloadImage",
        "summary": "Download an event image",
        "description": "Retrieve the image bytes from the GenerateImage result URL using its short-lived event token. Synthetic authorization header illustration: `Authorization: Basic synthetic-event-token`. Replace the illustrative value with the corresponding current credential.",
        "parameters": [
          {
            "in": "path",
            "name": "imageId",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1
            },
            "example": "synthetic-image"
          },
          {
            "in": "query",
            "name": "width",
            "schema": {
              "type": "integer",
              "minimum": 1
            },
            "description": "Pixel width; takes precedence over height.",
            "example": 640
          },
          {
            "in": "query",
            "name": "height",
            "schema": {
              "type": "integer",
              "minimum": 1
            },
            "description": "Pixel height when width is absent.",
            "example": 480
          }
        ],
        "security": [
          {
            "eventToken": []
          }
        ],
        "responses": {
          "200": {
            "description": "Encoded image bytes; opaque binary bytes are consumed as a stream. No synthetic byte string is presented as a real downloaded or verified media file.",
            "content": {
              "image/jpeg": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "default": {
            "description": "Download failed; callers receive a typed status error. Example status: HTTP 403 when authorization is rejected. Provider error bodies and content types vary, so this contract does not fabricate a JSON media error payload."
          }
        },
        "tags": [
          "Media"
        ]
      }
    },
    "/{mediaPath}": {
      "get": {
        "operationId": "DownloadClipPreview",
        "summary": "Download a camera clip preview",
        "description": "Retrieve the ten-frame H264 MP4 from a trusted ClipPreview event URL. The provider chooses the opaque path and query. Synthetic authorization header illustration: `Authorization: Bearer synthetic-access-token`. Replace the illustrative value with the corresponding current credential.",
        "parameters": [
          {
            "in": "path",
            "name": "mediaPath",
            "required": true,
            "description": "Opaque provider-issued path. This inventory template describes the URL; callers do not construct it.",
            "schema": {
              "type": "string",
              "minLength": 1
            },
            "example": "synthetic-clip.mp4"
          }
        ],
        "security": [
          {
            "oauthAccessToken": []
          }
        ],
        "responses": {
          "200": {
            "description": "Encoded clip preview bytes; opaque binary bytes are consumed as a stream. No synthetic byte string is presented as a real downloaded or verified media file.",
            "content": {
              "video/mp4": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "default": {
            "description": "Download failed; callers receive a typed status error. Example status: HTTP 403 when authorization is rejected. Provider error bodies and content types vary, so this contract does not fabricate a JSON media error payload."
          }
        },
        "tags": [
          "Media"
        ]
      }
    }
  },
  "components": {
    "securitySchemes": {
      "eventToken": {
        "type": "apiKey",
        "in": "header",
        "name": "Authorization",
        "description": "Basic followed by one space and the literal event token; not RFC 7617 user/password encoding."
      },
      "oauthAccessToken": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "MediaImageURL": {
        "type": "string",
        "format": "uri",
        "pattern": "^https://[^/?#]+/sdm_event_snapshot/[^?#]+",
        "example": "https://media.example.invalid/sdm_event_snapshot/synthetic-image?width=640"
      },
      "MediaClipURL": {
        "type": "string",
        "format": "uri",
        "pattern": "^https://[^/?#]+/",
        "example": "https://media.example.invalid/synthetic-clip.mp4"
      }
    }
  },
  "tags": [
    {
      "name": "Media",
      "description": "Camera image and clip preview downloads."
    }
  ]
}
