{
  "openapi": "3.0.3",
  "info": {
    "title": "Pub/Sub delivery transport",
    "version": "1.0.0"
  },
  "servers": [
    {
      "url": "https://pubsub.googleapis.com/v1"
    }
  ],
  "paths": {
    "/projects/{projectId}/subscriptions/{subscriptionId}:pull": {
      "post": {
        "operationId": "Pull",
        "summary": "Receive messages from a Pub/Sub subscription",
        "description": "Receive pending messages up to the requested limit. Decode each message data payload as an SDM event, then acknowledge its delivery identifier after processing.",
        "parameters": [
          {
            "name": "projectId",
            "in": "path",
            "required": true,
            "description": "Authorized resource identifier.",
            "schema": {
              "type": "string",
              "pattern": "^[^/]+$"
            },
            "example": "example-cloud-project"
          },
          {
            "name": "subscriptionId",
            "in": "path",
            "required": true,
            "description": "Authorized resource identifier.",
            "schema": {
              "type": "string",
              "pattern": "^[^/]+$"
            },
            "example": "example-subscription"
          }
        ],
        "responses": {
          "200": {
            "description": "Successful operation.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PullResponse"
                },
                "examples": {
                  "Delivery": {
                    "summary": "One decoded delivery wrapper",
                    "description": "Sanitized synthetic illustration; replace example identifiers and credentials with caller values.",
                    "value": {
                      "receivedMessages": [
                        {
                          "ackId": "synthetic-ack-id",
                          "message": {
                            "data": "",
                            "messageId": "synthetic-message-id",
                            "publishTime": "2026-01-01T12:00:01Z",
                            "attributes": {
                              "example": "synthetic"
                            }
                          },
                          "deliveryAttempt": 1
                        }
                      ]
                    }
                  },
                  "NoMessages": {
                    "summary": "No pending messages",
                    "description": "Sanitized synthetic illustration; replace example identifiers and credentials with caller values.",
                    "value": {}
                  }
                }
              }
            }
          },
          "default": {
            "description": "Pub/Sub rejected the delivery operation.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../errors.openapi.yaml#/components/schemas/GoogleErrorResponse"
                },
                "examples": {
                  "PermissionDenied": {
                    "summary": "Subscription consumption permission missing",
                    "description": "Sanitized synthetic illustration; replace example identifiers and credentials with caller values.",
                    "value": {
                      "error": {
                        "code": 403,
                        "status": "PERMISSION_DENIED",
                        "message": "The principal lacks pubsub.subscriptions.consume for this subscription."
                      }
                    }
                  },
                  "InvalidArgument": {
                    "summary": "Invalid delivery request",
                    "description": "Sanitized synthetic illustration; replace example identifiers and credentials with caller values.",
                    "value": {
                      "error": {
                        "code": 400,
                        "status": "INVALID_ARGUMENT",
                        "message": "The acknowledgement identifiers or deadline are invalid."
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PullRequest"
              },
              "examples": {
                "Request": {
                  "summary": "Pull request",
                  "description": "Sanitized synthetic illustration; replace example identifiers and credentials with caller values.",
                  "value": {
                    "maxMessages": 10
                  }
                }
              }
            }
          }
        },
        "tags": [
          "PubSub"
        ]
      }
    },
    "/projects/{projectId}/subscriptions/{subscriptionId}:acknowledge": {
      "post": {
        "operationId": "Acknowledge",
        "summary": "Acknowledge processed event messages",
        "description": "Mark the messages identified by their acknowledgement identifiers as processed so Pub/Sub can stop redelivering them to this subscription.",
        "parameters": [
          {
            "name": "projectId",
            "in": "path",
            "required": true,
            "description": "Authorized resource identifier.",
            "schema": {
              "type": "string",
              "pattern": "^[^/]+$"
            },
            "example": "example-cloud-project"
          },
          {
            "name": "subscriptionId",
            "in": "path",
            "required": true,
            "description": "Authorized resource identifier.",
            "schema": {
              "type": "string",
              "pattern": "^[^/]+$"
            },
            "example": "example-subscription"
          }
        ],
        "responses": {
          "200": {
            "description": "Successful operation.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EmptyResponse"
                },
                "examples": {
                  "Acknowledged": {
                    "summary": "Successful empty acknowledgement",
                    "description": "Sanitized synthetic illustration; replace example identifiers and credentials with caller values.",
                    "value": {}
                  }
                }
              }
            }
          },
          "default": {
            "description": "Pub/Sub rejected the delivery operation.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../errors.openapi.yaml#/components/schemas/GoogleErrorResponse"
                },
                "examples": {
                  "PermissionDenied": {
                    "summary": "Subscription consumption permission missing",
                    "description": "Sanitized synthetic illustration; replace example identifiers and credentials with caller values.",
                    "value": {
                      "error": {
                        "code": 403,
                        "status": "PERMISSION_DENIED",
                        "message": "The principal lacks pubsub.subscriptions.consume for this subscription."
                      }
                    }
                  },
                  "InvalidArgument": {
                    "summary": "Invalid delivery request",
                    "description": "Sanitized synthetic illustration; replace example identifiers and credentials with caller values.",
                    "value": {
                      "error": {
                        "code": 400,
                        "status": "INVALID_ARGUMENT",
                        "message": "The acknowledgement identifiers or deadline are invalid."
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AcknowledgeRequest"
              },
              "examples": {
                "Request": {
                  "summary": "Acknowledge request",
                  "description": "Sanitized synthetic illustration; replace example identifiers and credentials with caller values.",
                  "value": {
                    "ackIds": [
                      "synthetic-ack-id"
                    ]
                  }
                }
              }
            }
          }
        },
        "tags": [
          "PubSub"
        ]
      }
    },
    "/projects/{projectId}/subscriptions/{subscriptionId}:modifyAckDeadline": {
      "post": {
        "operationId": "ModifyAckDeadline",
        "summary": "Change a message acknowledgement deadline",
        "description": "Set the remaining acknowledgement deadline for the supplied delivery identifiers. Use a positive deadline while processing or zero to make messages available for immediate redelivery.",
        "parameters": [
          {
            "name": "projectId",
            "in": "path",
            "required": true,
            "description": "Authorized resource identifier.",
            "schema": {
              "type": "string",
              "pattern": "^[^/]+$"
            },
            "example": "example-cloud-project"
          },
          {
            "name": "subscriptionId",
            "in": "path",
            "required": true,
            "description": "Authorized resource identifier.",
            "schema": {
              "type": "string",
              "pattern": "^[^/]+$"
            },
            "example": "example-subscription"
          }
        ],
        "responses": {
          "200": {
            "description": "Successful operation.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EmptyResponse"
                },
                "examples": {
                  "Acknowledged": {
                    "summary": "Successful empty acknowledgement",
                    "description": "Sanitized synthetic illustration; replace example identifiers and credentials with caller values.",
                    "value": {}
                  }
                }
              }
            }
          },
          "default": {
            "description": "Pub/Sub rejected the delivery operation.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../errors.openapi.yaml#/components/schemas/GoogleErrorResponse"
                },
                "examples": {
                  "PermissionDenied": {
                    "summary": "Subscription consumption permission missing",
                    "description": "Sanitized synthetic illustration; replace example identifiers and credentials with caller values.",
                    "value": {
                      "error": {
                        "code": 403,
                        "status": "PERMISSION_DENIED",
                        "message": "The principal lacks pubsub.subscriptions.consume for this subscription."
                      }
                    }
                  },
                  "InvalidArgument": {
                    "summary": "Invalid delivery request",
                    "description": "Sanitized synthetic illustration; replace example identifiers and credentials with caller values.",
                    "value": {
                      "error": {
                        "code": 400,
                        "status": "INVALID_ARGUMENT",
                        "message": "The acknowledgement identifiers or deadline are invalid."
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ModifyAckDeadlineRequest"
              },
              "examples": {
                "Request": {
                  "summary": "ModifyAckDeadline request",
                  "description": "Sanitized synthetic illustration; replace example identifiers and credentials with caller values.",
                  "value": {
                    "ackIds": [
                      "synthetic-ack-id"
                    ],
                    "ackDeadlineSeconds": 60
                  }
                },
                "ReleaseForRedelivery": {
                  "summary": "Release immediately for redelivery",
                  "description": "Sanitized synthetic illustration; replace example identifiers and credentials with caller values.",
                  "value": {
                    "ackIds": [
                      "synthetic-ack-id"
                    ],
                    "ackDeadlineSeconds": 0
                  }
                }
              }
            }
          }
        },
        "tags": [
          "PubSub"
        ]
      }
    }
  },
  "components": {
    "schemas": {
      "PubSubMessage": {
        "type": "object",
        "properties": {
          "data": {
            "type": "string",
            "format": "byte"
          },
          "attributes": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          },
          "messageId": {
            "type": "string"
          },
          "publishTime": {
            "type": "string",
            "format": "date-time"
          },
          "orderingKey": {
            "type": "string"
          }
        },
        "additionalProperties": {
          "x-go-type": "json.RawMessage"
        },
        "example": {
          "data": "",
          "messageId": "synthetic-message-id",
          "publishTime": "2026-01-01T12:00:01Z",
          "attributes": {
            "example": "synthetic"
          }
        }
      },
      "ReceivedMessage": {
        "type": "object",
        "properties": {
          "ackId": {
            "type": "string"
          },
          "message": {
            "$ref": "#/components/schemas/PubSubMessage"
          },
          "deliveryAttempt": {
            "type": "integer"
          }
        },
        "additionalProperties": {
          "x-go-type": "json.RawMessage"
        },
        "example": {
          "ackId": "synthetic-ack-id",
          "message": {
            "data": "",
            "messageId": "synthetic-message-id",
            "publishTime": "2026-01-01T12:00:01Z",
            "attributes": {
              "example": "synthetic"
            }
          },
          "deliveryAttempt": 1
        }
      },
      "PullRequest": {
        "type": "object",
        "properties": {
          "maxMessages": {
            "type": "integer",
            "minimum": 1
          },
          "returnImmediately": {
            "type": "boolean",
            "deprecated": true
          }
        },
        "additionalProperties": false,
        "required": [
          "maxMessages"
        ],
        "example": {
          "maxMessages": 10
        }
      },
      "PullResponse": {
        "type": "object",
        "properties": {
          "receivedMessages": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ReceivedMessage"
            }
          }
        },
        "additionalProperties": {
          "x-go-type": "json.RawMessage"
        },
        "example": {
          "receivedMessages": [
            {
              "ackId": "synthetic-ack-id",
              "message": {
                "data": "",
                "messageId": "synthetic-message-id",
                "publishTime": "2026-01-01T12:00:01Z",
                "attributes": {
                  "example": "synthetic"
                }
              },
              "deliveryAttempt": 1
            }
          ]
        }
      },
      "AcknowledgeRequest": {
        "type": "object",
        "properties": {
          "ackIds": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        },
        "additionalProperties": false,
        "required": [
          "ackIds"
        ],
        "example": {
          "ackIds": [
            "synthetic-ack-id"
          ]
        }
      },
      "ModifyAckDeadlineRequest": {
        "type": "object",
        "properties": {
          "ackIds": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "ackDeadlineSeconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 600,
            "description": "Seconds from 0 through 600; zero makes the message available for immediate redelivery."
          }
        },
        "additionalProperties": false,
        "required": [
          "ackIds",
          "ackDeadlineSeconds"
        ],
        "example": {
          "ackIds": [
            "synthetic-ack-id"
          ],
          "ackDeadlineSeconds": 60
        }
      },
      "PushEnvelope": {
        "type": "object",
        "properties": {
          "message": {
            "$ref": "#/components/schemas/PubSubMessage"
          },
          "subscription": {
            "type": "string"
          },
          "deliveryAttempt": {
            "type": "integer"
          }
        },
        "additionalProperties": {
          "x-go-type": "json.RawMessage"
        },
        "required": [
          "message",
          "subscription"
        ],
        "example": {
          "message": {
            "data": "",
            "messageId": "synthetic-message-id",
            "publishTime": "2026-01-01T12:00:01Z",
            "attributes": {
              "example": "synthetic"
            }
          },
          "subscription": "projects/example-cloud-project/subscriptions/example-subscription",
          "deliveryAttempt": 1
        }
      },
      "EmptyResponse": {
        "type": "object",
        "properties": {},
        "additionalProperties": {
          "x-go-type": "json.RawMessage"
        },
        "example": {}
      }
    },
    "securitySchemes": {
      "pubsubBearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "OAuth 2.0 access token",
        "description": "OAuth 2.0 access token for a principal with pubsub.subscriptions.consume permission on the subscription, such as the Pub/Sub Subscriber role. Authorize the token with https://www.googleapis.com/auth/pubsub or https://www.googleapis.com/auth/cloud-platform scope; SDM account authorization does not grant Pub/Sub IAM access."
      }
    }
  },
  "tags": [
    {
      "name": "PubSub",
      "description": "Authorized pubsub operations."
    }
  ],
  "security": [
    {
      "pubsubBearerAuth": []
    }
  ]
}
