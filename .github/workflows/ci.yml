name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.24.x', '1.26.x']
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint every Go module with pinned all-linter configuration
        run: make lint
      - name: Build, contract checks, paired replay, races, vet, coverage floor
        run: make check
      - name: Check formatting
        run: go run ./tools/verify -mode format-check
      - name: Check every module's metadata
        run: make check-modules
      - name: Regenerate schemas and models and detect tracked or untracked drift
        run: make check-generated
      - name: Capture verification failure diagnostics
        if: failure()
        shell: bash
        run: |
          diagnostics="$RUNNER_TEMP/verification-diagnostics"
          mkdir -p "$diagnostics"
          git status --porcelain=v1 --untracked-files=all > "$diagnostics/status.txt"
          git diff --no-ext-diff --binary HEAD -- api internal pkg docs/model-inventory.json docs/api-reference.openapi.json go.mod go.sum cmd/go-google-nest-sdm/go.mod cmd/go-google-nest-sdm/go.sum tests/consumer/go.mod tests/consumer/go.sum > "$diagnostics/generated-and-module.patch"
          cp docs/model-inventory.json "$diagnostics/model-inventory.checked-in.json"
          if go run ./tools/contractcheck -write-inventory "$diagnostics/model-inventory.regenerated.json" > "$diagnostics/inventory.log" 2>&1; then
            git diff --no-index -- "$diagnostics/model-inventory.checked-in.json" "$diagnostics/model-inventory.regenerated.json" > "$diagnostics/inventory.patch" || test "$?" -eq 1
            wc -c "$diagnostics"/model-inventory.*.json > "$diagnostics/inventory-bytes.txt"
            if command -v sha256sum >/dev/null; then
              sha256sum "$diagnostics"/model-inventory.*.json > "$diagnostics/inventory-sha256.txt"
            else
              shasum -a 256 "$diagnostics"/model-inventory.*.json > "$diagnostics/inventory-sha256.txt"
            fi
          else
            printf '%s\n' 'Inventory regeneration failed; see inventory.log.' >> "$diagnostics/inventory.log"
          fi
      - name: Upload verification failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-failure-${{ matrix.os }}-${{ matrix.go }}
          path: ${{ runner.temp }}/verification-diagnostics
          if-no-files-found: error
      - name: Upload separate unit, replay, and combined coverage profiles
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.go }}
          path: coverage-*.out

  api-compatibility:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: auto
      COMPAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Report public API compatibility against the exact base commit
        run: go run ./tools/compatibility -policy report -base "$COMPAT_BASE"
