name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing SDK release tag to verify and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: auto
      PUBLIC_MODULE: github.com/portpowered/go-google-nest-sdm
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete library and every module's checks
        run: make lint check check-modules check-generated
      - name: Enforce public API release compatibility
        run: go run ./tools/compatibility -policy release -base previous-release -version "$VERSION"
      - name: Verify the tagged public module from an independent consumer
        shell: bash
        run: |
          check_dir="$(mktemp -d)"
          cp tests/consumer/*_test.go "$check_dir/"
          cd "$check_dir"
          go mod init example.com/sdm-release-consumer
          module_ready=false
          for attempt in {1..6}; do
            if go get "${PUBLIC_MODULE}@${VERSION}"; then
              module_ready=true
              break
            fi
            echo "Waiting for the tagged module in the Go proxy (attempt ${attempt}/6)"
            sleep 10
          done
          test "$module_ready" = true
          go mod tidy
          go test ./...
      - name: Verify API documentation and customer guide publishing inputs
        uses: portpowered/api-docs-website-github-action@v0.3.1
        with:
          title: Google Nest SDM API Reference
          openapi: docs/api-reference.openapi.json
          asyncapi: api/asyncapi.yaml
          discover: false
          guides-directory: docs/guides
          output: site
      - name: Verify generated customer guides, reference pages, and internal navigation
        run: go run ./tools/docs -site site -base /${{ github.event.repository.name }}
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --verify-tag --notes-file .github/release-notes-sdk.md
